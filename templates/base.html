<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">  
<style>
    body{
        background-color: #f4f6f9;;

        }
    .navbar{
        background-color: blue;
    }    
    .card{
        border: none;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
</style>
</head>
  <nav class="navbar navbar-dark">
    <a href="/" class="navbar-brand text-white text-decoration-none mx-auto">
        <i class="fa fa-database"></i> Campus Records Management System
    </a>

    <div class="d-flex ms-auto">
        {% if session.get('user') %}
            <a class="btn btn-outline-light rounded-pill me-2" href="{{ url_for('auth.profile') }}">
                <i class="fa fa-user-circle"></i> Profile
            </a>
            <a class="btn btn-danger rounded-pill" href="{{ url_for('auth.logout') }}">
                Logout
            </a>
        {% else %}
            <a class="btn btn-primary rounded-pill" href="{{ url_for('auth.signup') }}">
                Signup
            </a>
        {% endif %}
    </div>
</nav>

<div class="container mt-5">
    {% block content %}
    {% endblock %}
</div>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="alert alert-warning mt-3">
      {% for message in messages %}
        {{ message }}
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

       
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>

{% extends 'base.html' %}
{% block content %}
<div class="card p-4 md-6 mx-auto">
    <h4 class="mb-3">
        <i class = "fa fa-user-plus"></i> Add Student
    </h4>

    <form action="/add" method ="POST">
        <input type ="text" name="name" class="form-control mb-3" placeholder="Enter Name">
        <input type ="email" name="email" class="form-control mb-3" placeholder="Enter Email">
        <input type ="text" name="course" class="form-control mb-3" placeholder="Enter Course">
    
        <button class="btn btn-success w-100">
        <i class="fa fa-save"></i> Save Student
        </button>
    
    </form>

    

{% endblock %}
